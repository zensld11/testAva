spring.application.name=AvaWorld
server.port=8082
server.servlet.context-path=/ava

#Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate

#DataBase Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ava_world
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${PASSWORD}
spring.jpa.show-sql=false

#Amazon S3
s3.access-key=${ACCESS_KEY}
s3.secret-key=${SECRET_KEY}
s3.bucket-name=${BUCKET_NAME}
s3.endpoint=https://zenl-test.s3.eu-north-1.amazonaws.com
s3.aws.region=eu-north-1

#SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.to=killopowqwert@gmail.com
spring.mail.from=baktvbekovaadelina@gmail.com
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true

spring.mail.test-connection=true